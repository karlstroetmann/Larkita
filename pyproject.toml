[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "larkita"
authors = [{name = "Karl Stroetmann"}, {name = "Erez Shinan (Lark)", email = "erezshin@gmail.com"}]
license = {text = "MIT"}
description = "A light-weight canonical LR(1) parser generator that returns abstract syntax trees as nested tuples"
keywords = ["LR(1)", "parser", "parsing", "ast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.8"
dependencies = []
dynamic = ["version"]

[project.readme]
text = """
Larkita is a light-weight version of the parser generator Lark (https://github.com/lark-parser/lark).
- Always generates canonical LR(1) parsers.
- The parsers return abstract syntax trees as nested tuples.
- Writes a description of the LR(1) automaton (all states with their lookaheads) to an output file.
- Uses Lark's EBNF grammar syntax, its contextual lexer, and its standard library of terminals."""
content-type = "text/markdown"

[project.optional-dependencies]
regex = ["regex"]
interegular = ["interegular>=0.3.1,<0.4.0"]

[tool.setuptools]
packages = [
    "larkita",
    "larkita.grammars",
]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.lark"]
larkita = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "larkita.__version__"}

[tool.mypy]
files = ["larkita"]
python_version = "3.9"
show_error_codes = true

[tool.pytest.ini_options]
minversion = 6.0
addopts = "-ra -q"
testpaths =[
    "tests"
]
python_files = "test_*.py"
