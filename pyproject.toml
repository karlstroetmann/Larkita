[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "larkita"
authors = [{name = "Karl Stroetmann"}, {name = "Erez Shinan (Lark)", email = "erezshin@gmail.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "A light-weight canonical LR(1) parser generator that returns abstract syntax trees as nested tuples"
keywords = ["LR(1)", "parser", "parsing", "ast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]
requires-python = ">=3.12"
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/karlstroetmann/Larkita"
Documentation = "https://github.com/karlstroetmann/Larkita/blob/master/tutorial/larkita-tutorial.pdf"

[project.optional-dependencies]
regex = ["regex"]
interegular = ["interegular>=0.3.1,<0.4.0"]
pygments = ["pygments"]

# The lexers for highlighting grammars, e.g. with pygmentize -l larkita or IPython.display.Code
[project.entry-points."pygments.lexers"]
larkita = "larkita.pygments_lexer:LarkitaLexer"
python-larkita = "larkita.pygments_lexer:PythonLarkitaLexer"

[tool.setuptools]
packages = [
    "larkita",
    "larkita.grammars",
]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.lark"]
larkita = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "larkita.__version__"}

[tool.mypy]
files = ["larkita"]
python_version = "3.12"
show_error_codes = true

[tool.pytest.ini_options]
minversion = 6.0
addopts = "-ra -q"
testpaths =[
    "tests"
]
python_files = "test_*.py"
