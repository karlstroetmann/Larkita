# Publishes Larkita on PyPI when a tag like v0.1.0 is pushed.
# PyPI trusts this workflow ("Trusted Publishing"), so no API token is needed.
name: Publish on PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check that the tag matches the version of Larkita
        run: test "${GITHUB_REF_NAME#v}" = "$(python -c 'import larkita; print(larkita.__version__)')"
      - name: Install Pygments for the tests of the lexers in larkita/pygments_lexer.py
        run: python -m pip install pygments
      - name: Run the tests
        run: python -m tests
      - name: Build the package
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
